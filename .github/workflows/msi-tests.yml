name: MSI tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'install | upgrade | full'
        required: true
        default: 'install'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  LISAN_SIGNING_CERT_THUMBPRINT: ${{ secrets.LISAN_SIGNING_CERT_THUMBPRINT }}
  LISAN_SIGNTOOL_PATH: ${{ vars.LISAN_SIGNTOOL_PATH }}
  LISAN_TIMESTAMP_URL: ${{ vars.LISAN_TIMESTAMP_URL }}

jobs:
  msi-install:
    if: inputs.scenario == 'install' || inputs.scenario == 'full'
    runs-on: [self-hosted, windows, lisanstudio-qa]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout apython runtime dependency
        uses: actions/checkout@v4
        with:
          repository: GalaxyRuler/lughat-althuban
          # pinned 2026-05-22; bump deliberately when adopting newer apython
          ref: 77cc50db5fe1e35661a0b133945290bbd192e642
          path: apython-src
          token: ${{ secrets.APYTHON_CHECKOUT_TOKEN || github.token }}

      - name: Ensure Python packaging and debugger dependencies
        shell: powershell
        run: |
          $missing = @()
          python -c "import setuptools" *> $null
          if ($LASTEXITCODE -ne 0) { $missing += 'setuptools' }
          python -c "import wheel" *> $null
          if ($LASTEXITCODE -ne 0) { $missing += 'wheel' }
          if ($missing.Count -gt 0) {
            python -m pip install --quiet --disable-pip-version-check --prefer-binary @missing
          }
          $runtimePython = "C:\Users\codexqa\AppData\Local\Programs\Python\Python313\python.exe"
          $debugpyVersion = '1.8.20'
          $needDebugpy = $true
          $previousErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $v = & $runtimePython -c "import debugpy, sys; sys.stdout.write(debugpy.__version__)" 2>$null
            if ($LASTEXITCODE -eq 0 -and $v -eq $debugpyVersion) { $needDebugpy = $false }
          } catch {
            $needDebugpy = $true
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if ($needDebugpy) {
            & $runtimePython -m pip install --quiet --disable-pip-version-check --prefer-binary debugpy==$debugpyVersion
            $v = & $runtimePython -c "import debugpy, sys; sys.stdout.write(debugpy.__version__)" 2>$null
            if ($LASTEXITCODE -ne 0 -or $v -ne $debugpyVersion) {
              throw "debugpy $debugpyVersion installation failed for bundled runtime python"
            }
          }

      - name: Prepare apython runtime metadata
        shell: powershell
        working-directory: apython-src
        run: |
          python -c "from setuptools import setup; setup(script_args=['egg_info'])"
          if (-not (Test-Path -LiteralPath (Join-Path $PWD 'lughat_althuban.egg-info\PKG-INFO'))) {
            throw 'apython metadata generation did not produce lughat_althuban.egg-info\PKG-INFO'
          }

      - name: Build MSI
        shell: powershell
        run: |
          .\scripts\build.ps1
          .\scripts\package.ps1 `
            -ProductVersion 1.0.0 `
            -BuildId $env:GITHUB_SHA `
            -ApythonRoot "${{ github.workspace }}\apython-src" `
            -PythonRoot "C:\Users\codexqa\AppData\Local\Programs\Python\Python313"

      - name: Install MSI and assert HKLM uninstall state
        shell: powershell
        run: |
          $msiPath = Join-Path $PWD 'artifacts\LisanStudio-1.0.0-beta.msi'
          .\scripts\msi-smoke.ps1 -MsiPath $msiPath

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-install-evidence-${{ github.run_id }}
          path: |
            artifacts/LisanStudio-1.0.0-beta.msi
            artifacts/SIGNING_STATUS.txt
            artifacts/msi-smoke/**

  msi-upgrade:
    if: inputs.scenario == 'upgrade' || inputs.scenario == 'full'
    runs-on: [self-hosted, windows, lisanstudio-qa]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout apython runtime dependency
        uses: actions/checkout@v4
        with:
          repository: GalaxyRuler/lughat-althuban
          # pinned 2026-05-22; bump deliberately when adopting newer apython
          ref: 77cc50db5fe1e35661a0b133945290bbd192e642
          path: apython-src
          token: ${{ secrets.APYTHON_CHECKOUT_TOKEN || github.token }}

      - name: Ensure Python packaging and debugger dependencies
        shell: powershell
        run: |
          $missing = @()
          python -c "import setuptools" *> $null
          if ($LASTEXITCODE -ne 0) { $missing += 'setuptools' }
          python -c "import wheel" *> $null
          if ($LASTEXITCODE -ne 0) { $missing += 'wheel' }
          if ($missing.Count -gt 0) {
            python -m pip install --quiet --disable-pip-version-check --prefer-binary @missing
          }
          $runtimePython = "C:\Users\codexqa\AppData\Local\Programs\Python\Python313\python.exe"
          $debugpyVersion = '1.8.20'
          $needDebugpy = $true
          $previousErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $v = & $runtimePython -c "import debugpy, sys; sys.stdout.write(debugpy.__version__)" 2>$null
            if ($LASTEXITCODE -eq 0 -and $v -eq $debugpyVersion) { $needDebugpy = $false }
          } catch {
            $needDebugpy = $true
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }
          if ($needDebugpy) {
            & $runtimePython -m pip install --quiet --disable-pip-version-check --prefer-binary debugpy==$debugpyVersion
            $v = & $runtimePython -c "import debugpy, sys; sys.stdout.write(debugpy.__version__)" 2>$null
            if ($LASTEXITCODE -ne 0 -or $v -ne $debugpyVersion) {
              throw "debugpy $debugpyVersion installation failed for bundled runtime python"
            }
          }

      - name: Prepare apython runtime metadata
        shell: powershell
        working-directory: apython-src
        run: |
          python -c "from setuptools import setup; setup(script_args=['egg_info'])"
          if (-not (Test-Path -LiteralPath (Join-Path $PWD 'lughat_althuban.egg-info\PKG-INFO'))) {
            throw 'apython metadata generation did not produce lughat_althuban.egg-info\PKG-INFO'
          }

      - name: Download v1 MSI from published v0.1.0-beta release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fixtureDir = Join-Path $env:GITHUB_WORKSPACE 'msi-fixtures'
          New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
          gh release download v0.1.0-beta `
            --repo $env:GITHUB_REPOSITORY `
            --pattern '*.msi' `
            --dir $fixtureDir

      - name: Build current MSI v2
        shell: powershell
        run: |
          .\scripts\build.ps1
          .\scripts\package.ps1 `
            -ProductVersion 1.0.0 `
            -BuildId $env:GITHUB_SHA `
            -ApythonRoot "${{ github.workspace }}\apython-src" `
            -PythonRoot "C:\Users\codexqa\AppData\Local\Programs\Python\Python313"

      - name: Install v1, upgrade to v2, and assert upgrade behavior
        shell: powershell
        run: |
          $earlierMsiPath = Join-Path $env:GITHUB_WORKSPACE 'msi-fixtures\LisanStudio-0.1.0-beta.msi'
          $replacementMsiPath = Join-Path $PWD 'artifacts\LisanStudio-1.0.0-beta.msi'
          .\scripts\msi-upgrade-smoke.ps1 `
            -EarlierMsiPath $earlierMsiPath `
            -ReplacementMsiPath $replacementMsiPath `
            -ExpectedEarlierVersion 0.1.0 `
            -ExpectedReplacementVersion 1.0.0 `
            -AllowMutation `
            -IUnderstandThisRunsMsiUpgrade

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-upgrade-evidence-${{ github.run_id }}
          path: |
            msi-fixtures/LisanStudio-0.1.0-beta.msi
            artifacts/LisanStudio-1.0.0-beta.msi
            artifacts/SIGNING_STATUS.txt
            artifacts/msi-upgrade-smoke/**
